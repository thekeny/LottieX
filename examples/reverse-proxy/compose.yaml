services:
  lottiex:
    build: ../..
    restart: unless-stopped
    stop_grace_period: 35s
    volumes:
      - ./lottiex.compose.json:/etc/lottiex/lottiex.json:ro
    networks:
      - apps

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - apps

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: app
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - apps
      - data

  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

  grafana:
    image: grafana/grafana:12
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - apps

networks:
  apps:
  data:
    internal: true

volumes:
  database:
  grafana:
