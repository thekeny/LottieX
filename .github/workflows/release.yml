name: Release LottieX

on:
  repository_dispatch:
    types: [lottiex-release]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
    outputs:
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release tag in the form vX.Y.Z' >&2
            exit 1
          fi
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ make python3
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Build and package Linux x86_64
        id: package
        run: |
          ./scripts/release.sh --package
          version=$(./build/lttx version)
          version=${version#LottieX }
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Expected tag v$version for this build" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Run HTTP tests
        run: |
          python3 tests/smoke.py
          python3 tests/proxy.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          tag=$RELEASE_TAG
          title="LottieX $tag"
          latest=false
          master=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
          if [[ "$COMMIT" == "$master" ]]; then
            latest=true
          fi
          assets=(release-assets/lottiex-linux-x86_64.tar.gz release-assets/SHA256SUMS)

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --latest="$latest"
            fi
          else
            gh release create "$tag" "${assets[@]}" --verify-tag \
              --title "$title" --generate-notes --latest="$latest"
          fi
